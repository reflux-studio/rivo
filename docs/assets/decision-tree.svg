<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" lang="zh-CN">
  <title>重要决定用 ADR 记录；一个决定可能引出其他决定或待回答的问题</title>
  <style>
    text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
    .bg { fill: #ffffff; }
    .node { fill: #f4f6f8; stroke: #8a96a3; stroke-width: 1.5; }
    .input .node { fill: #eef1f4; stroke: #5f6b7a; }
    .adr .node { fill: #e8f5ee; stroke: #2f9e6b; }
    .open .node { fill: #ffffff; stroke: #d9822b; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #5f6b7a; stroke-width: 1.5; }
    .edge.pending { stroke: #d9822b; stroke-dasharray: 5 4; }
    .arrow { fill: #5f6b7a; }
    .arrow-pending { fill: #d9822b; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 12px; fill: #5f6b7a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-pending" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow-pending" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="840" height="240"/>

  <g id="n-blueprint" class="input">
    <rect class="node" x="20" y="90" width="120" height="50" rx="8"/>
    <text class="name" x="80" y="115" text-anchor="middle" dominant-baseline="central">你的思路</text>
  </g>
  <g id="n-001" class="adr">
    <rect class="node" x="190" y="90" width="160" height="50" rx="8"/>
    <text class="name" x="270" y="106" text-anchor="middle" dominant-baseline="central">ADR 001</text>
    <text class="sub" x="270" y="126" text-anchor="middle" dominant-baseline="central">按模板逐个审批</text>
  </g>
  <g id="n-002" class="adr">
    <rect class="node" x="400" y="30" width="180" height="50" rx="8"/>
    <text class="name" x="490" y="46" text-anchor="middle" dominant-baseline="central">ADR 002</text>
    <text class="sub" x="490" y="66" text-anchor="middle" dominant-baseline="central">全部模板通过才归档</text>
  </g>
  <g id="n-003" class="adr">
    <rect class="node" x="400" y="150" width="180" height="50" rx="8"/>
    <text class="name" x="490" y="166" text-anchor="middle" dominant-baseline="central">ADR 003</text>
    <text class="sub" x="490" y="186" text-anchor="middle" dominant-baseline="central">驳回后回到草稿</text>
  </g>
  <g id="n-004" class="adr">
    <rect class="node" x="630" y="30" width="190" height="50" rx="8"/>
    <text class="name" x="725" y="46" text-anchor="middle" dominant-baseline="central">ADR 004</text>
    <text class="sub" x="725" y="66" text-anchor="middle" dominant-baseline="central">超时自动提醒审批人</text>
  </g>
  <g id="q-reassign" class="open">
    <rect class="node" x="630" y="150" width="190" height="50" rx="8"/>
    <text class="name" x="725" y="166" text-anchor="middle" dominant-baseline="central">待回答</text>
    <text class="sub" x="725" y="186" text-anchor="middle" dominant-baseline="central">驳回后能否换审批人？</text>
  </g>

  <g id="e-blueprint-001">
    <path class="edge" d="M140,115 L190,115" marker-end="url(#arrow)"/>
  </g>
  <g id="e-001-002">
    <path class="edge" d="M350,115 L375,115 L375,55 L400,55" marker-end="url(#arrow)"/>
  </g>
  <g id="e-001-003">
    <path class="edge" d="M350,115 L375,115 L375,175 L400,175" marker-end="url(#arrow)"/>
  </g>
  <g id="e-002-004">
    <path class="edge" d="M580,55 L630,55" marker-end="url(#arrow)"/>
  </g>
  <g id="e-003-q">
    <path class="edge pending" d="M580,175 L630,175" marker-end="url(#arrow-pending)"/>
  </g>

  <g id="legend">
    <g class="adr"><rect class="node" x="20" y="218" width="14" height="10" rx="2"/></g>
    <text class="label" x="42" y="223" dominant-baseline="central">已确认的重要取舍：ADR</text>
    <g class="open"><rect class="node" x="220" y="218" width="14" height="10" rx="2"/></g>
    <text class="label" x="242" y="223" dominant-baseline="central">待回答的问题：前提确定后继续讨论</text>
  </g>
</svg>
