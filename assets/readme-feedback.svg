<svg xmlns="http://www.w3.org/2000/svg" width="960" height="864" viewBox="0 0 960 864" role="img" aria-labelledby="title desc">
<title id="title">需求疑问与缺陷怎样往返</title><desc id="desc">需求疑问交产品和有权负责人，测试缺陷交开发修复，测试复验并报告结果。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#2B2622}
.bg{fill:#F6F3EA}.card{fill:#FFFDF8;stroke:#D8D1C5;stroke-width:1.5}.rule{stroke:#D8D1C5;stroke-width:1}.arrow{fill:none;stroke:#8B8176;stroke-width:2}.life{stroke:#C9C0B3;stroke-width:1.5;stroke-dasharray:4 6}.heading{font-size:25px;font-weight:650}.title{font-size:20px;font-weight:600}.role{font-size:16px;fill:#C8402A;font-weight:600}.body{font-size:16px;fill:#5F574F}.label{font-size:16px}.small{font-size:15px;fill:#756C62}.section{font-size:17px;font-weight:600;fill:#C8402A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8B8176"/></marker></defs>
<rect x="0" y="0" width="960" height="864" rx="16" class="bg"/><text x="32" y="47" class="heading" text-anchor="start">有疑问找产品，有缺陷找开发</text><text x="32" y="77" class="body" text-anchor="start">每个角色修改自己负责的产物，确认后再接着推进。</text><rect x="40" y="100" width="188" height="70" rx="12" class="card"/><text x="134" y="130" class="title" text-anchor="middle">你 / 有权负责人</text><text x="134" y="153" class="small" text-anchor="middle">业务与重要取舍</text><path d="M134 181V755" class="life"/><rect x="270" y="100" width="188" height="70" rx="12" class="card"/><text x="364" y="130" class="title" text-anchor="middle">产品 AI</text><text x="364" y="153" class="small" text-anchor="middle">维护需求与设计</text><path d="M364 181V755" class="life"/><rect x="500" y="100" width="188" height="70" rx="12" class="card"/><text x="594" y="130" class="title" text-anchor="middle">开发 AI</text><text x="594" y="153" class="small" text-anchor="middle">维护方案与产品代码</text><path d="M594 181V755" class="life"/><rect x="730" y="100" width="188" height="70" rx="12" class="card"/><text x="824" y="130" class="title" text-anchor="middle">测试 AI</text><text x="824" y="153" class="small" text-anchor="middle">维护用例与报告</text><path d="M824 181V755" class="life"/><rect x="28" y="188" width="904" height="33" rx="4" class="bg"/><text x="42" y="211" class="section" text-anchor="start">01 / 需求不明确时</text><rect x="28" y="468" width="904" height="33" rx="4" class="bg"/><text x="42" y="491" class="section" text-anchor="start">02 / 提测后发现缺陷</text><path d="M586 253H374" class="arrow" marker-end="url(#arrow)"/><rect x="380" y="223" width="198" height="24" rx="3" class="bg"/><text x="479" y="241" class="label" text-anchor="middle">停用主联系人后怎么办？</text><path d="M356 311H144" class="arrow" marker-end="url(#arrow)"/><rect x="166" y="281" width="166" height="24" rx="3" class="bg"/><text x="249" y="299" class="label" text-anchor="middle">提出业务规则与建议</text><path d="M142 369H354" class="arrow" marker-end="url(#arrow)"/><rect x="190" y="339" width="118" height="24" rx="3" class="bg"/><text x="249" y="357" class="label" text-anchor="middle">确认业务规则</text><path d="M372 427H584" class="arrow" marker-end="url(#arrow)"/><rect x="396" y="397" width="166" height="24" rx="3" class="bg"/><text x="479" y="415" class="label" text-anchor="middle">更新需求与验收标准</text><path d="M602 533H814" class="arrow" marker-end="url(#arrow)"/><rect x="618" y="503" width="182" height="24" rx="3" class="bg"/><text x="709" y="521" class="label" text-anchor="middle">交提测版本与自测结果</text><text x="709" y="555" class="small" text-anchor="middle">实现、自测及开发审阅完成</text><path d="M816 591H604" class="arrow" marker-end="url(#arrow)"/><rect x="602" y="561" width="214" height="24" rx="3" class="bg"/><text x="709" y="579" class="label" text-anchor="middle">缺陷：刷新显示旧主联系人</text><path d="M602 649H814" class="arrow" marker-end="url(#arrow)"/><rect x="650" y="619" width="118" height="24" rx="3" class="bg"/><text x="709" y="637" class="label" text-anchor="middle">提供修复版本</text><text x="709" y="671" class="small" text-anchor="middle">开发修改产品代码并自测</text><path d="M816 719H144" class="arrow" marker-end="url(#arrow)"/><rect x="380" y="689" width="198" height="24" rx="3" class="bg"/><text x="479" y="707" class="label" text-anchor="middle">复测回归结果与剩余风险</text><text x="479" y="741" class="small" text-anchor="middle">测试复验；是否验收由有权人决定</text><path d="M32 781H928" class="rule"/><text x="32" y="811" class="body" text-anchor="start">图中的产品、开发、测试也可由人类同事承担。</text><text x="32" y="839" class="small" text-anchor="start">测试保留失败证据，开发提供修复版本，测试复验；是否验收由有权人决定。</text></svg>
