<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 960 552" role="img" aria-labelledby="title desc">
<title id="title">一次需求怎样走完</title><desc id="desc">按编号从左至右，再沿箭头从右至左阅读六个阶段。测试用例可提前设计。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#2B2622}
.bg{fill:#F6F3EA}.card{fill:#FFFDF8;stroke:#D8D1C5;stroke-width:1.5}.rule{stroke:#D8D1C5;stroke-width:1}.arrow{fill:none;stroke:#8B8176;stroke-width:2}.life{stroke:#C9C0B3;stroke-width:1.5;stroke-dasharray:4 6}.heading{font-size:25px;font-weight:650}.title{font-size:20px;font-weight:600}.role{font-size:16px;fill:#C8402A;font-weight:600}.body{font-size:16px;fill:#5F574F}.label{font-size:16px}.small{font-size:15px;fill:#756C62}.section{font-size:17px;font-weight:600;fill:#C8402A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8B8176"/></marker></defs>
<rect x="0" y="0" width="960" height="552" rx="16" class="bg"/><text x="32" y="47" class="heading" text-anchor="start">一次需求怎样走完</text><text x="32" y="77" class="body" text-anchor="start">各角色围绕同一需求工作，重要决定由你或有权负责人确认。</text><path d="M272 176H352" class="arrow" marker-end="url(#arrow)"/><path d="M600 176H680" class="arrow" marker-end="url(#arrow)"/><path d="M808 242V298" class="arrow" marker-end="url(#arrow)"/><path d="M688 372H608" class="arrow" marker-end="url(#arrow)"/><path d="M360 372H280" class="arrow" marker-end="url(#arrow)"/><text x="316" y="156" class="small" text-anchor="middle">规则确认</text><text x="644" y="156" class="small" text-anchor="middle">取舍确认</text><text x="791" y="277" class="small" text-anchor="end">确认并授权</text><text x="644" y="352" class="small" text-anchor="middle">提测</text><text x="316" y="352" class="small" text-anchor="middle">用户验收</text><rect x="32" y="110" width="240" height="132" rx="12" class="card"/><text x="52" y="139" class="role" text-anchor="start">产品 AI</text><text x="52" y="177" class="title" text-anchor="start">01 澄清需求</text><text x="52" y="211" class="body" text-anchor="start">规则、状态与验收标准</text><rect x="360" y="110" width="240" height="132" rx="12" class="card"/><text x="380" y="139" class="role" text-anchor="start">开发 AI</text><text x="380" y="177" class="title" text-anchor="start">02 技术讨论</text><text x="380" y="211" class="body" text-anchor="start">查证约束，比较做法</text><rect x="688" y="110" width="240" height="132" rx="12" class="card"/><text x="708" y="139" class="role" text-anchor="start">开发 AI</text><text x="708" y="177" class="title" text-anchor="start">03 方案与独立审阅</text><text x="708" y="211" class="body" text-anchor="start">写清做法与契约</text><rect x="688" y="306" width="240" height="132" rx="12" class="card"/><text x="708" y="335" class="role" text-anchor="start">开发 AI</text><text x="708" y="373" class="title" text-anchor="start">04 实施与开发审阅</text><text x="708" y="407" class="body" text-anchor="start">实现、自测与独立审阅</text><rect x="360" y="306" width="240" height="132" rx="12" class="card"/><text x="380" y="335" class="role" text-anchor="start">测试 AI</text><text x="380" y="373" class="title" text-anchor="start">05 专业测试与复验</text><text x="380" y="407" class="body" text-anchor="start">发现差异，修复后复测回归</text><rect x="32" y="306" width="240" height="132" rx="12" class="card"/><text x="52" y="335" class="role" text-anchor="start">各角色 AI</text><text x="52" y="373" class="title" text-anchor="start">06 整理已核实知识</text><text x="52" y="407" class="body" text-anchor="start">验收后留下机制与理由</text><path d="M32 465H928" class="rule"/><text x="32" y="495" class="section" text-anchor="start">测试提前准备</text><text x="174" y="495" class="body" text-anchor="start">需求明确后即可设计用例，与开发实施并行。</text><text x="32" y="525" class="small" text-anchor="start">图中先展示交付主线；需求疑问、新约束与缺陷的反馈方式见下图和正文。</text></svg>
