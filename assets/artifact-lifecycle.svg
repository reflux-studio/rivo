<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <style>
    .title{fill:#1f2328;font-size:20px;font-weight:700}
    .label{fill:#1f2328;font-size:14px;font-weight:600}
    .small{fill:#57606a;font-size:12px}
    .tiny{fill:#57606a;font-size:11px}
    .line{stroke:#8c959f;stroke-width:1.6;fill:none}
    .loop{stroke:#bf8700;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    .arrow{fill:#8c959f}
    .arrow-warn{fill:#bf8700}
    .author{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.4}
    .review{fill:#fbefff;stroke:#8957e5;stroke-width:1.4}
    .verify{fill:#ffebe9;stroke:#fa4549;stroke-width:1.4}
    .finding{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.4}
    .baseline{fill:#dafbe1;stroke:#2da44e;stroke-width:1.4}
    .neutral{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
    @media (prefers-color-scheme: dark){
      .title,.label{fill:#e6edf3}
      .small,.tiny{fill:#9198a1}
      .line{stroke:#6e7681}
      .loop{stroke:#d29922}
      .arrow{fill:#6e7681}
      .arrow-warn{fill:#d29922}
      .author{fill:#0f2440;stroke:#1f6feb}
      .review{fill:#231532;stroke:#8957e5}
      .verify{fill:#2b1215;stroke:#da3633}
      .finding{fill:#2a230b;stroke:#9e6a03}
      .baseline{fill:#0f2417;stroke:#238636}
      .neutral{fill:#21262d;stroke:#6e7681}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-warn" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <text class="title" x="480" y="34" text-anchor="middle">单个产物的统一生命周期</text>
  <text class="small" x="480" y="56" text-anchor="middle">入口可以不同，放行协议相同；每个新修订都重新建立信任</text>

  <!-- Author -->
  <rect class="author" x="36" y="102" width="168" height="68" rx="12"/>
  <text class="label" x="120" y="128" text-anchor="middle">负责人起草 / 修订</text>
  <text class="small" x="120" y="149" text-anchor="middle">基于正式输入作出决定</text>

  <line class="line" x1="204" y1="136" x2="260" y2="136" marker-end="url(#arrow)"/>
  <rect class="author" x="270" y="102" width="168" height="68" rx="12"/>
  <text class="label" x="354" y="128" text-anchor="middle">发布候选版本</text>
  <text class="small" x="354" y="149" text-anchor="middle">位置 · 版本 · 变更摘要</text>

  <!-- Split -->
  <path class="line" d="M438 136 H476 V103 H510" marker-end="url(#arrow)"/>
  <path class="line" d="M476 136 V207 H510" marker-end="url(#arrow)"/>

  <rect class="review" x="520" y="72" width="196" height="68" rx="12"/>
  <text class="label" x="618" y="98" text-anchor="middle">领域交叉评审</text>
  <text class="small" x="618" y="119" text-anchor="middle">其他决定权域检查影响</text>

  <rect class="verify" x="520" y="176" width="196" height="68" rx="12"/>
  <text class="label" x="618" y="202" text-anchor="middle">独立验证</text>
  <text class="small" x="618" y="223" text-anchor="middle">隔离创作上下文 · 核对证据</text>

  <!-- Join -->
  <path class="line" d="M716 106 H754 V158 H780" marker-end="url(#arrow)"/>
  <path class="line" d="M716 210 H754 V158"/>
  <rect class="finding" x="790" y="124" width="140" height="68" rx="12"/>
  <text class="label" x="860" y="150" text-anchor="middle">发现闭环</text>
  <text class="small" x="860" y="171" text-anchor="middle">没有沉默通过</text>

  <!-- Finding resolution -->
  <path class="line" d="M860 192 V230 H740 V256" marker-end="url(#arrow)"/>
  <rect class="finding" x="192" y="256" width="576" height="92" rx="14"/>
  <text class="label" x="480" y="281" text-anchor="middle">逐条处理发现</text>

  <rect class="neutral" x="216" y="296" width="152" height="36" rx="8"/>
  <text class="small" x="292" y="319" text-anchor="middle">已解决：修改 + 复核</text>
  <rect class="neutral" x="384" y="296" width="192" height="36" rx="8"/>
  <text class="small" x="480" y="319" text-anchor="middle">已跳过：理由 + 提出者认可</text>
  <rect class="neutral" x="592" y="296" width="152" height="36" rx="8"/>
  <text class="small" x="668" y="319" text-anchor="middle">待裁决：交给用户</text>

  <!-- Loop for revisions -->
  <path class="loop" d="M192 302 H112 V188 H326 V176" marker-end="url(#arrowWarn)"/>
  <text class="tiny" x="123" y="218">需要修改</text>
  <text class="tiny" x="123" y="234">发布新版本后重新双查</text>

  <!-- Gate -->
  <path class="line" d="M480 348 V394" marker-end="url(#arrow)"/>
  <text class="tiny" x="492" y="378">无待处理 / 待裁决发现</text>
  <rect class="baseline" x="360" y="404" width="240" height="68" rx="12"/>
  <text class="label" x="480" y="430" text-anchor="middle">成为可依赖基线</text>
  <text class="small" x="480" y="451" text-anchor="middle">当前版本获得放行资格</text>

  <!-- Downstream -->
  <line class="line" x1="600" y1="438" x2="664" y2="438" marker-end="url(#arrow)"/>
  <rect class="neutral" x="674" y="394" width="250" height="88" rx="12"/>
  <text class="label" x="799" y="419" text-anchor="middle">直接下游判断影响</text>
  <text class="small" x="799" y="441" text-anchor="middle">无需修改 · 需要更新 · 需要说明</text>
  <text class="tiny" x="799" y="461" text-anchor="middle">需要更新的下游产物进入自己的完整生命周期</text>

  <!-- Principles -->
  <rect class="neutral" x="36" y="516" width="888" height="36" rx="10" stroke-dasharray="5 4"/>
  <text class="small" x="480" y="539" text-anchor="middle">严重度用于理解影响，不决定放行；共同同意不能替代独立证据，Verifier 也不能越权代替负责人作决定</text>
</svg>
