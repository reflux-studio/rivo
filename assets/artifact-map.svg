<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <style>
    .title{fill:#1f2328;font-size:21px;font-weight:700}
    .section{fill:#57606a;font-size:12px;font-weight:600;letter-spacing:.8px}
    .label{fill:#1f2328;font-size:15px;font-weight:650}
    .small{fill:#57606a;font-size:12px}
    .tiny{fill:#57606a;font-size:11px}
    .line{stroke:#8c959f;stroke-width:1.6;fill:none}
    .context{stroke:#8c959f;stroke-width:1.3;fill:none;stroke-dasharray:5 5}
    .arrow{fill:#8c959f}
    .shared{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.3}
    .product{fill:#fff1e5;stroke:#e16f24;stroke-width:1.5}
    .design{fill:#fbefff;stroke:#8957e5;stroke-width:1.5}
    .engineer{fill:#dafbe1;stroke:#2da44e;stroke-width:1.5}
    .verifier{fill:#ffebe9;stroke:#fa4549;stroke-width:1.5}
    .gate{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.4}
    .record{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
    @media (prefers-color-scheme: dark){
      .title,.label{fill:#e6edf3}
      .section,.small,.tiny{fill:#9198a1}
      .line,.context{stroke:#6e7681}
      .arrow{fill:#6e7681}
      .shared{fill:#0f2440;stroke:#1f6feb}
      .product{fill:#2b1a10;stroke:#bd561d}
      .design{fill:#231532;stroke:#8957e5}
      .engineer{fill:#0f2417;stroke:#238636}
      .verifier{fill:#2b1215;stroke:#da3633}
      .gate{fill:#2a230b;stroke:#9e6a03}
      .record{fill:#21262d;stroke:#6e7681}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <text class="title" x="540" y="34" text-anchor="middle">Rivo 的产物分层与多入口</text>
  <text class="small" x="540" y="56" text-anchor="middle">长期认知提供约束；单次交付从最高受影响节点进入；过程记录不冒充新的决定层</text>

  <!-- Shared profile -->
  <rect class="shared" x="30" y="78" width="1020" height="50" rx="11"/>
  <text class="label" x="168" y="108" text-anchor="middle">PROFILE.md</text>
  <text class="small" x="590" y="108" text-anchor="middle">全员协作配置：产物后端 · 审批点 · 验证策略 · 分支与发布约定</text>
  <text class="tiny" x="1008" y="108" text-anchor="end">Team Lead 代表团队维护</text>

  <!-- Long-term cognition -->
  <text class="section" x="30" y="158">跨交付的长期认知</text>

  <rect class="product" x="30" y="174" width="240" height="86" rx="12"/>
  <text class="label" x="150" y="202" text-anchor="middle">PRODUCT.md</text>
  <text class="small" x="150" y="224" text-anchor="middle">Product · 定位、用户、价值与边界</text>
  <text class="tiny" x="150" y="244" text-anchor="middle">由 surveying-product 建立或校准</text>

  <rect class="design" x="290" y="174" width="240" height="86" rx="12"/>
  <text class="label" x="410" y="202" text-anchor="middle">DESIGN.md</text>
  <text class="small" x="410" y="224" text-anchor="middle">Designer · token、组件与交互惯例</text>
  <text class="tiny" x="410" y="244" text-anchor="middle">由 surveying-design 建立或校准</text>

  <rect class="engineer" x="550" y="174" width="240" height="86" rx="12"/>
  <text class="label" x="670" y="202" text-anchor="middle">ENGINEERING.md</text>
  <text class="small" x="670" y="224" text-anchor="middle">Engineer · 架构、惯例、运行与验证</text>
  <text class="tiny" x="670" y="244" text-anchor="middle">由 surveying-codebase 建立或校准</text>

  <rect class="verifier" x="810" y="174" width="240" height="86" rx="12"/>
  <text class="label" x="930" y="202" text-anchor="middle">VERIFICATION.md（可选）</text>
  <text class="small" x="930" y="224" text-anchor="middle">Verifier · 项目特定的验证校准</text>
  <text class="tiny" x="930" y="244" text-anchor="middle">仅在有漏检、误报或环境证据时创建</text>

  <!-- Context relationships -->
  <path class="context" d="M150 260 V350" marker-end="url(#arrow)"/>
  <path class="context" d="M410 260 V350" marker-end="url(#arrow)"/>
  <path class="context" d="M670 260 V350" marker-end="url(#arrow)"/>
  <path class="context" d="M930 260 H1062 V545 H962" marker-end="url(#arrow)"/>

  <!-- Per-delivery artifacts -->
  <text class="section" x="30" y="306">单次交付的可依赖承诺</text>
  <text class="tiny" x="1050" y="306" text-anchor="end">任一受影响的最高节点都可以成为入口；未触达的节点不建占位产物</text>

  <rect class="product" x="30" y="350" width="240" height="92" rx="12"/>
  <text class="label" x="150" y="378" text-anchor="middle">requirement</text>
  <text class="small" x="150" y="400" text-anchor="middle">Product · 产品决定</text>
  <text class="tiny" x="150" y="422" text-anchor="middle">入口：价值、用户行为或验收预期变化</text>

  <rect class="design" x="290" y="350" width="240" height="92" rx="12"/>
  <text class="label" x="410" y="378" text-anchor="middle">ui-design</text>
  <text class="small" x="410" y="400" text-anchor="middle">Designer · 体验决定</text>
  <text class="tiny" x="410" y="422" text-anchor="middle">入口：产品预期不变，只改变体验表达</text>

  <rect class="engineer" x="550" y="350" width="240" height="92" rx="12"/>
  <text class="label" x="670" y="378" text-anchor="middle">system-design</text>
  <text class="small" x="670" y="400" text-anchor="middle">Engineer · 技术决定</text>
  <text class="tiny" x="670" y="422" text-anchor="middle">入口：内部机制、质量属性或技术目标</text>

  <rect class="engineer" x="810" y="350" width="240" height="92" rx="12"/>
  <text class="label" x="930" y="378" text-anchor="middle">实现</text>
  <text class="small" x="930" y="400" text-anchor="middle">Engineer · 代码、测试与实现交接</text>
  <text class="tiny" x="930" y="422" text-anchor="middle">入口：已有明确改动目标，无需新增方案决定</text>

  <line class="line" x1="270" y1="396" x2="284" y2="396" marker-end="url(#arrow)"/>
  <line class="line" x1="530" y1="396" x2="544" y2="396" marker-end="url(#arrow)"/>
  <line class="line" x1="790" y1="396" x2="804" y2="396" marker-end="url(#arrow)"/>
  <text class="tiny" x="540" y="334" text-anchor="middle">上游约束下游；只有实际受影响时才继续传播</text>

  <!-- Every version enters the same lifecycle -->
  <path class="line" d="M150 442 V474 M410 442 V474 M670 442 V474 M930 442 V474 M150 474 H930 M540 474 V500" marker-end="url(#arrow)"/>
  <rect class="gate" x="120" y="508" width="840" height="78" rx="13"/>
  <text class="label" x="540" y="536" text-anchor="middle">每个新版本进入同一套放行协议</text>
  <text class="small" x="540" y="558" text-anchor="middle">领域交叉评审 + 独立验证 → 发现闭环 → 可依赖基线 → 直接下游三选一响应</text>
  <text class="tiny" x="540" y="576" text-anchor="middle">VERIFICATION.md 只校准独立验证；它不是第四种创作产物</text>

  <!-- Process records -->
  <rect class="record" x="30" y="626" width="1020" height="104" rx="13"/>
  <text class="label" x="540" y="653" text-anchor="middle">状态、证据与过程记录（不是新的决定层）</text>
  <text class="small" x="540" y="678" text-anchor="middle">state.md · reviews.md · verification.md · investigation.md · uat.md · release.md · retro.md · evidence/</text>
  <text class="tiny" x="540" y="700" text-anchor="middle">investigation.md 确实存在：systematic-debugging 在正式交付中的排查记录；它先形成根因证据，再把问题归类回上述负责节点</text>
  <text class="tiny" x="540" y="718" text-anchor="middle">调研、竞品、路线图和技术债评估也先作为长期认知、输入证据或候选工作；需要落地时再由 Team Lead 判断正式入口</text>
</svg>
